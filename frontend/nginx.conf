server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads de template chegam por aqui; o padrão do nginx (1 MB) recusaria.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashes no nome dos arquivos do Vite: podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # A API é servida no mesmo endereço do painel. Assim o bundle chama "/api" em vez de um
    # domínio fixo, e a aplicação inteira funciona por um endereço só — localhost, um túnel
    # temporário ou o domínio definitivo — sem precisar de novo build nem de CORS.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gerar texto pode passar de dois minutos em serviços gratuitos de IA.
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    # O React Router resolve a rota no cliente, então tudo volta para o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
