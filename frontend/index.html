<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>JH.COMP Engineering System</title>
    <script>
      // Aplica o tema antes da primeira pintura; em React a tela já viria branca piscando.
      try {
        var salvo = localStorage.getItem('jh-tema');
        var claro = salvo ? salvo === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.classList.toggle('light', claro);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
