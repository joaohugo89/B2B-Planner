# Ajustes para rodar a stack de produção na sua própria máquina.
# Use sempre junto com o docker-compose.prod.yml:
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml --env-file .env up -d --build
#
# Num servidor de verdade, use o docker-compose.prod.yml sozinho.
#
# O "!override" existe porque o Compose SOMA as listas de portas dos dois arquivos: sem ele, o
# painel ficaria publicado na 8080 e na 8090 ao mesmo tempo.

services:
  postgres:
    ports: !override
      # As portas 5432 a 5437 são das instâncias do PostgreSQL instaladas no Windows.
      # O banco do container atende na 5440, para DBeaver, pgAdmin ou psql.
      - "5440:5432"

  frontend:
    ports: !override
      - "8090:80"
