# Modo vídeo: o backend sai do Docker e roda no Windows, onde alcança os motores de IA
# (voz e sincronia no WSL, transcrição em C:\engines). O resto continua aqui.
#
# Por que não os dois: um contêiner não inicia programas do Windows nem do WSL, e dois
# backends no mesmo banco disputam a porta 8081 e a fila de jobs de vídeo.
#
# Use pelo scripts/video-local.ps1, que sobe esta combinação e o backend no host.
services:
  # Sem perfil ativo com este nome, o compose não cria nem sobe o backend em contêiner.
  backend:
    profiles: ["backend-em-conteiner"]

  frontend:
    depends_on: !reset []
    environment:
      BACKEND_URL: http://host.docker.internal:8081
    extra_hosts:
      # Já existe no Docker Desktop; a linha garante o mesmo nome num Docker de Linux.
      - "host.docker.internal:host-gateway"
